name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: |
          cd tests
          make clean && make test

      - name: Build with coverage instrumentation
        run: |
          cd tests
          make clean
          make cov-build

      - name: Grant port-102 capability
        run: |
          cd tests
          sudo setcap 'cap_net_bind_service=+ep' build/snap7_tests

      - name: Run coverage
        run: |
          cd tests
          make cov-run

      - name: Coverage gate
        run: |
          pip install gcovr
          cd tests
          make cov-check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test Rust wrapper
        run: |
          cd release/wrappers/rust
          cargo test --no-run
          find target/debug/deps -name 'wrapper_partner-*' -type f -executable \
            -exec sudo setcap 'cap_net_bind_service=+ep' {} +
          cargo test

      - name: Measure Rust wrapper coverage
        run: |
          rustup component add llvm-tools-preview
          cd release/wrappers/rust
          RUSTFLAGS="-C instrument-coverage" cargo test --test wrapper_partner --no-run
          find target/debug/deps -name 'wrapper_partner-*' -type f -executable \
            -exec sudo setcap 'cap_net_bind_service=+ep' {} +
          ./coverage.sh --rust
